# Despliegue local: app + Mailpit (ver .docs/06_DESPLIEGUE_LOCAL.md)
#   Solo el SMTP falso:  docker compose up -d mailpit
#   Todo (app + smtp):   cp .env.example .env && docker compose up --build
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: reportes-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web para inspeccionar correos y adjuntos
    restart: unless-stopped

  app:
    build: .
    container_name: task-reportes-back
    depends_on:
      - mailpit
    env_file:
      - .env
    environment:
      TZ: America/Lima
      SMTP_HOST: mailpit   # dentro de la red de compose el relay es el servicio mailpit
      SMTP_PORT: "1025"
    ports:
      - "8080:8080"
    restart: unless-stopped
